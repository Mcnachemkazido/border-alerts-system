services:
  mongo:
    image: mongo
    container_name: con-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: asdf
    ports:
      - "27017:27017"
    healthcheck:
      test: [ "CMD","mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s




  cache:
    image: redis
    restart: always
    container_name: redis
    ports:
      - '6379:6379'
    volumes:
      - cache:/data
    healthcheck:
      test: [ "CMD", "redis-cli","ping" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  producer:
    depends_on:
      cache:
        condition: service_healthy

    build: ./producer
    container_name: producer
    environment:
      REDIS_HOST: cache
      REDIS_PORT: 6379

  consumer:
    depends_on:
      cache:
        condition: service_healthy
      mongo:
        condition: service_healthy
      producer:
        condition: service_started

    build: ./ consumer
    container_name: consumer
    environment:
      REDIS_HOST: cache
      REDIS_PORT: 6379
      MONGO_USER: root
      MONGO_PASS: asdf
      MONGO_HOST: mongo
      MONGO_PORT: 27017





volumes:
  cache:
